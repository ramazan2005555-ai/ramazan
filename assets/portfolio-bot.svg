<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg3)"/>
  <!-- Phone body -->
  <rect x="150" y="15" width="100" height="210" rx="14" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <rect x="155" y="30" width="90" height="180" rx="4" fill="#0f0f1a"/>
  <!-- Telegram header -->
  <rect x="155" y="30" width="90" height="24" fill="#1b2836"/>
  <circle cx="168" cy="42" r="7" fill="#4facfe" opacity="0.3"/>
  <rect x="180" y="38" width="30" height="5" rx="1.5" fill="#4facfe" opacity="0.8"/>
  <rect x="180" y="45" width="20" height="3" rx="1" fill="#555"/>
  <!-- Chat messages -->
  <rect x="160" y="60" width="55" height="20" rx="8" fill="#1b2836"/>
  <rect x="166" y="66" width="40" height="3" rx="1" fill="#aaa"/>
  <rect x="166" y="72" width="28" height="3" rx="1" fill="#888"/>
  
  <rect x="175" y="86" width="60" height="24" rx="8" fill="#4facfe" opacity="0.25"/>
  <rect x="181" y="92" width="44" height="3" rx="1" fill="#4facfe" opacity="0.8"/>
  <rect x="181" y="98" width="32" height="3" rx="1" fill="#4facfe" opacity="0.5"/>
  
  <rect x="160" y="116" width="65" height="28" rx="8" fill="#1b2836"/>
  <!-- Product card in message -->
  <rect x="164" y="120" width="24" height="16" rx="3" fill="#4facfe" opacity="0.2"/>
  <rect x="192" y="120" width="28" height="4" rx="1" fill="#aaa"/>
  <rect x="192" y="128" width="20" height="3" rx="1" fill="#4facfe" opacity="0.6"/>
  <rect x="192" y="134" width="16" height="4" rx="2" fill="#4facfe" opacity="0.4"/>
  
  <rect x="175" y="150" width="55" height="16" rx="8" fill="#4facfe" opacity="0.25"/>
  <rect x="181" y="155" width="40" height="3" rx="1" fill="#4facfe" opacity="0.7"/>
  
  <rect x="160" y="172" width="70" height="20" rx="8" fill="#1b2836"/>
  <rect x="166" y="178" width="54" height="3" rx="1" fill="#aaa"/>
  <rect x="166" y="184" width="40" height="3" rx="1" fill="#888"/>
  <!-- Input bar -->
  <rect x="155" y="196" width="90" height="14" fill="#1b2836"/>
  <rect x="160" y="199" width="60" height="8" rx="4" fill="#0f1a24"/>
  <circle cx="232" cy="203" r="5" fill="#4facfe" opacity="0.5"/>
  <!-- Floating elements -->
  <circle cx="70" cy="80" r="18" fill="#fff" opacity="0.07"/>
  <circle cx="330" cy="160" r="25" fill="#fff" opacity="0.06"/>
</svg>

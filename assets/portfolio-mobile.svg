<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/></linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg2)"/>
  <!-- Phone body -->
  <rect x="150" y="15" width="100" height="210" rx="14" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <rect x="155" y="30" width="90" height="180" rx="4" fill="#0f0f1a"/>
  <!-- Status bar -->
  <rect x="155" y="30" width="90" height="14" fill="#12122a"/>
  <rect x="162" y="35" width="16" height="4" rx="1" fill="#555"/>
  <rect x="222" y="35" width="12" height="4" rx="1" fill="#555"/>

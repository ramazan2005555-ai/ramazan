  <circle cx="175" cy="205" r="3" fill="#f093fb"/><circle cx="195" cy="205" r="3" fill="#444"/>
  <circle cx="215" cy="205" r="3" fill="#444"/><circle cx="235" cy="205" r="3" fill="#444"/>
  <!-- Floating elements -->
  <circle cx="80" cy="60" r="20" fill="#fff" opacity="0.08"/>
  <circle cx="320" cy="180" r="30" fill="#fff" opacity="0.06"/>
  <rect x="50" y="140" width="40" height="40" rx="8" fill="#fff" opacity="0.05" transform="rotate(15 70 160)"/>

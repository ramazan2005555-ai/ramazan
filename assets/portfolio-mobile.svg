  <circle cx="232" cy="53" r="6" fill="#f093fb" opacity="0.3"/>
  <!-- Stats cards -->
  <rect x="160" y="74" width="38" height="36" rx="6" fill="#1e1e3a"/>
  <rect x="202" y="74" width="38" height="36" rx="6" fill="#1e1e3a"/>
  <rect x="165" y="80" width="20" height="5" rx="1" fill="#f5576c" opacity="0.7"/>
  <rect x="165" y="90" width="28" height="8" rx="1" fill="#fff" opacity="0.8"/>
  <rect x="207" y="80" width="20" height="5" rx="1" fill="#f093fb" opacity="0.7"/>
  <rect x="207" y="90" width="28" height="8" rx="1" fill="#fff" opacity="0.8"/>
  <!-- Chart -->
  <rect x="160" y="116" width="80" height="50" rx="6" fill="#1e1e3a"/>
  <polyline points="168,155 180,140 192,148 204,130 216,135 228,125" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.8"/>
  <circle cx="168" cy="155" r="2.5" fill="#f093fb"/><circle cx="228" cy="125" r="2.5" fill="#f5576c"/>
  <!-- Workout list -->
  <rect x="160" y="172" width="80" height="10" rx="3" fill="#1e1e3a"/>
  <rect x="164" y="175" width="30" height="4" rx="1" fill="#f5576c" opacity="0.5"/>
